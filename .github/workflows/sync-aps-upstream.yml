name: Sync APS upstream

on:
  schedule:
    # 11:17 UTC is approximately 6:17 a.m. in Chicago during daylight time.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-aps-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge APS main into fork
    runs-on: ubuntu-latest

    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch APS upstream
        run: |
          git remote add upstream https://github.com/AdvancedPhotonSource/AI-DINO.git
          git fetch --prune upstream main

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-edit upstream/main

      - name: Push synchronized main
        run: git push origin main
